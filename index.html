
<!DOCTYPE html>
<html>
<head>
  <title>MR SALUTE - Official Artist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: white;
      text-align: center;
    }

    .hero {
      padding: 80px 20px;
      background: radial-gradient(circle, #1a1a1a, #000);
    }

    h1 {
      font-size: 45px;
      color: #ff2e63;
    }

    p {
      color: #bbb;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 18px;
      background: #ff2e63;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .section {
      padding: 50px 20px;
    }

    iframe {
      width: 90%;
      max-width: 600px;
      height: 300px;
      border-radius: 12px;
    }

    .music {
      background: #111;
      padding: 30px;
      margin: 20px;
      border-radius: 12px;
    }

    audio {
      width: 90%;
      max-width: 400px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
      height: 120px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <div class="hero">
    <h1>MR SALUTE</h1>
    <p>Delhi Based Artist | Rapper | Influencer</p>

    <a class="btn" href="https://instagram.com" target="_blank">Instagram</a>
    <a class="btn" href="https://youtube.com" target="_blank">YouTube</a>
  </div>

  <!-- VIDEO -->
  <div class="section">
    <h2>🔥 Latest Video</h2>
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
  </div>

  <!-- MUSIC -->
  <div class="section music">
    <h2>🎵 Latest Track</h2>
    <p>Play your song here</p>
    <audio controls>
      <source src="song.mp3" type="audio/mpeg">
      Your browser does not support audio.
    </audio>
  </div>

  <!-- ABOUT -->
  <div class="section">
    <h2>🎤 About Me</h2>
    <p>
      MR SALUTE is a rising Delhi artist building his identity in music, street culture and influence.
    </p>
  </div>

  <!-- GALLERY -->
  <div class="section">
    <h2>📸 Gallery</h2>
    <div class="gallery">
      <img src="https://via.placeholder.com/300x300.png?text=MR+SALUTE">
      <img src="https://via.placeholder.com/300x300.png?text=Delhi+Vibes">
      <img src="https://via.placeholder.com/300x300.png?text=Studio">
      <img src="https://via.placeholder.com/300x300.png?text=Live+Show">
    </div>
  </div>

</body>
</html>
